<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A page with its video in JSON</title>
</head>
<body>
  <h1>A page with its video in JSON</h1>
  <div id="player"></div>
  <!-- Only a tag chain finds the video: its URL is relative, in JSON that a player would read. -->
  <script id="data" type="application/json">{"video": {"title": "Sample", "src": "/media/sample.mp4"}}</script>
</body>
</html>
