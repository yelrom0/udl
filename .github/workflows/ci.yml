name: CI

# `make check` (the same gates as the pre-commit hook) on every PR into main and every push to main.
# Never `pull_request_target`: the repo is public, and a fork's PR must not see secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # uv reads .python-version and fetches that Python itself. setup-uv publishes no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      # Node 26 and pnpm (web/package.json's packageManager), for the web checks in `make check`.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # (`make check` runs `check-web`, which does the `--frozen-lockfile` install itself.)
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # (The frontend and the shell are built by `make e2e`'s own `web` target: one install and
      # one build, not two. Playwright's Chromium is the Python Playwright's version, 1.63, so
      # the one download serves both.)
      - name: Install Chromium for Playwright
        run: uv run playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

      # The built UI is package data (18.3): `uv build` must put it in the wheel. `make e2e` has
      # just built it, so this check runs rather than skips.
      - name: The wheel holds the built UI
        run: uv run pytest tests/interface/web/test_serving.py -q
