[project]
name = "udl"
version = "0.1.0"
description = "Ultra Downloader: works out how to download a URL, remembers it per site, and exposes it via CLI, API and MCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "cronsim>=2.7",
    "fastapi>=0.143.0",
    "gallery-dl>=1.32.16",
    "google-re2>=1.1.20251105",
    "granian>=2.8.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "platformdirs>=4.12.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "selectolax>=1.0.0",
    "sqlmodel>=0.0.48",
    "tldextract>=5.4.0",
    "typer>=0.27.3",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]
postgres = [
    "psycopg[binary]>=3.3.6",
]
mongodb = [
    "pymongo>=4.19.0",
]

[project.scripts]
udl = "udl.interfaces.cli.app:main"

# Built-in plugins are registered the same way third-party plugins are.
[project.entry-points."udl.databases"]
memory = "udl.plugins.databases.memory:MemoryDatabase"
mongodb = "udl.plugins.databases.mongodb:MongoDBPlugin"
postgres = "udl.plugins.databases.postgres:PostgresPlugin"
sqlite = "udl.plugins.databases.sqlite:SQLitePlugin"

[project.entry-points."udl.downloaders"]
browser = "udl.plugins.downloaders.browser:BrowserDownloader"
gallery-dl = "udl.plugins.downloaders.gallerydl:GalleryDlDownloader"
http = "udl.plugins.downloaders.http:HttpDownloader"
scraper = "udl.plugins.downloaders.scraper:ScraperDownloader"
yt-dlp = "udl.plugins.downloaders.ytdlp:YtDlpDownloader"

[project.entry-points."udl.sites"]
youtube = "udl.plugins.sites.youtube:YouTubePlugin"

[project.entry-points."udl.secrets"]
file = "udl.plugins.secrets.file:FileSecretStore"
keyring = "udl.plugins.secrets.keyring:KeyringSecretStore"
memory = "udl.plugins.secrets.memory:MemorySecretStore"

[project.entry-points."udl.actions"]
emit = "udl.plugins.actions.emit:EmitAction"
notify = "udl.plugins.actions.notify:NotifyAction"
operation = "udl.plugins.actions.operation:OperationAction"
script = "udl.plugins.actions.script:ScriptAction"
webhook = "udl.plugins.actions.webhook:WebhookAction"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-yt-dlp>=2026.8.19.20261008",
    "udl[browser,postgres,mongodb]",
    "uvicorn>=0.54.0",
]

# ---------------------------------------------------------------------------------------------
# Quality tooling: `make check` runs all of it (see Makefile)
# ---------------------------------------------------------------------------------------------

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Shared test helpers live in tests/support and are imported as `support.*`.
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not network"]
strict = true
filterwarnings = ["error"]
markers = [
    "integration: real tools or the local fixture site (auto-applied to tests/integration)",
    "network: talks to real sites, opt-in with `pytest -m network` (auto-applied to tests/smoke)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["udl"]
# Measure the udl processes tests start too (`python -m udl`, `udl serve` and `udl mcp`).
patch = ["subprocess"]

[tool.coverage.report]
# Ratchet upwards, never down.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
# Leave the hand-aligned snippets in planning.md, planning/ and README.md alone.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "A",            # builtin shadowing
    "C4",           # comprehensions
    "SIM",          # simplify
    "PT",           # pytest style
    "PTH",          # pathlib over os.path
    "RET",          # return statements
    "RUF",          # ruff-specific
    "ASYNC",        # async pitfalls
    "TID",          # tidy imports
    "BLE",          # blind except
    "S",            # bandit (security)
    "T20",          # no print(): interfaces render, library code logs
]
ignore = [
    "N818",  # errors are named for the condition (AuthRequired, NotFound), per the error taxonomy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest tests are written

[tool.ruff.lint.isort]
known-first-party = ["udl"]

[tool.uv.sources]
udl = { workspace = true }
